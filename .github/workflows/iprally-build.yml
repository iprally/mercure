name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: iprally-build-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-and-push:
    if: github.repository == 'iprally/mercure' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: build

    permissions:
      contents: read
      id-token: write

    env:
      IMAGE: europe-west1-docker.pkg.dev/shared-resources-343513/iprally-mercure/mercure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          access_token_lifetime: 3600s
          workload_identity_provider: projects/938400219272/locations/global/workloadIdentityPools/github-identity-pool/providers/github-oidc-provider
          service_account: gha-mercure@shared-resources-343513.iam.gserviceaccount.com
          project_id: shared-resources-343513

      - name: Login to Google Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Check whether this commit is already published
        id: published
        run: |
          set -uo pipefail
          if out="$(docker manifest inspect "$IMAGE:$GITHUB_SHA" 2>&1)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$IMAGE:$GITHUB_SHA already exists; it is not built again"
          elif grep -q 'no such manifest' <<< "$out"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not check whether $IMAGE:$GITHUB_SHA exists: $out"
            exit 1
          fi

      - name: Build and push Docker image
        if: steps.published.outputs.exists != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
